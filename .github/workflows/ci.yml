name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    name: Verify and build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go test ./...
      - run: go vet ./...
      - run: scripts/build-release.sh
        env:
          AIW_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
      - uses: actions/upload-artifact@v4
        with:
          name: aiw-binaries-${{ github.sha }}
          path: dist/aiw-*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aiw-binaries-${{ github.sha }}
          path: dist
      - name: Package versioned archives and checksums
        env:
          AIW_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release stage
          for binary in dist/aiw-*; do
            target="${binary#dist/aiw-}"
            os="${target%-*}"
            arch="${target##*-}"
            staging_dir="stage/${os}-${arch}"
            mkdir -p "$staging_dir"
            cp "$binary" "$staging_dir/aiw"
            tar -C "$staging_dir" -czf "release/aiw_${AIW_VERSION}_${os}_${arch}.tar.gz" aiw
          done
          (cd release && sha256sum ./*.tar.gz > checksums.txt)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          AIW_VERSION: ${{ github.ref_name }}
        run: gh release create "$AIW_VERSION" release/*.tar.gz release/checksums.txt --title "$AIW_VERSION" --generate-notes
